
networks:
  iot-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  grafana-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  spark-checkpoints:

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: iot-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "10"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iot-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: iot-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - iot-net

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -i healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iot-net

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: iot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9090:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - iot-net

  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    container_name: iot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio_init/init_buckets.sh:/init_buckets.sh
    entrypoint: ["/bin/sh", "/init_buckets.sh"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: iot-telemetry-raw
    networks:
      - iot-net

  postgres:
    image: postgres:16.4
    container_name: iot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      POSTGRES_DB: iot_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iot-net

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: iot-producer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: iot-sensor-telemetry
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPIC: iot/sensors/telemetry
      NUM_DEVICES: "10"
      EMIT_INTERVAL_SECONDS: "1"
      ANOMALY_PROBABILITY: "0.05"
      PUBLISH_MODE: "kafka"
    networks:
      - iot-net

  spark-processor:
    build:
      context: ./spark_processor
      dockerfile: Dockerfile
    container_name: iot-spark-processor
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: iot-sensor-telemetry
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: iot-telemetry-raw
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: iot_db
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      TEMP_THRESHOLD_C: "85.0"
      VIBRATION_THRESHOLD_HZ: "90.0"
      SPARK_CHECKPOINT_DIR: /tmp/spark-checkpoints
    ports:
      - "4040:4040"
    volumes:
      - spark-checkpoints:/tmp/spark-checkpoints
    networks:
      - iot-net

  grafana:
    image: grafana/grafana:11.1.4
    container_name: iot-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - iot-net

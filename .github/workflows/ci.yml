name: CI - Lint, Syntax Check & Compose Validation

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: {}

jobs:

  python-lint-and-syntax:
    name: Python Lint & Syntax Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [producer, spark_processor]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black

      - name: Install component requirements
        working-directory: ${{ matrix.component }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Python syntax compile check
        working-directory: ${{ matrix.component }}
        run: |
          python -m py_compile *.py

      - name: Flake8 lint (errors only, non-blocking style)
        working-directory: ${{ matrix.component }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Black formatting check (non-blocking)
        working-directory: ${{ matrix.component }}
        continue-on-error: true
        run: |
          black --check --diff .

  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - producer/Dockerfile
          - spark_processor/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  compose-validate:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Validate docker-compose.yml syntax
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate SQL init script syntax (basic parse)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          # Basic sanity check: file is non-empty and contains expected DDL keywords
          test -s db/init.sql
          grep -qi "CREATE TABLE" db/init.sql
          grep -qi "anomaly_events" db/init.sql

      - name: Shellcheck MinIO init script
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./minio_init"

  build-images:
    name: Build Container Images (no push)
    runs-on: ubuntu-latest
    needs: [python-lint-and-syntax, compose-validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build producer image
        uses: docker/build-push-action@v5
        with:
          context: ./producer
          file: ./producer/Dockerfile
          push: false
          tags: iot-producer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build spark_processor image
        uses: docker/build-push-action@v5
        with:
          context: ./spark_processor
          file: ./spark_processor/Dockerfile
          push: false
          tags: iot-spark-processor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke-test:
    name: Docker Compose Smoke Test (build only)
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all services via Compose
        run: docker compose -f docker-compose.yml build

      - name: List built images
        run: docker images